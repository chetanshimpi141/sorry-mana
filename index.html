<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Mau ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to right, #1e1e2f, #3a3a5a);
  color: white;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#container {
  max-width: 600px;
  z-index: 1;
}

h1 {
  min-height: 60px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

/* Pulse animation */
#forgiveBtn {
  background: #4CAF50;
  color: white;
  animation: pulse 1.2s infinite;
}

#waitBtn {
  background: #ff9800;
  color: white;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

#subtext {
  transition: opacity 0.4s ease;
}

/* Canvas background */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div id="container">
  <h1 id="message"></h1>
  <p id="subtext"></p>

  <button id="forgiveBtn" onclick="forgive()">Forgive ❤️</button>
  <button id="waitBtn" onclick="wait()">Still Angry 😒</button>
</div>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
const name = "Mau";
const message = document.getElementById("message");
const subtext = document.getElementById("subtext");

// ✅ MUSIC FIX (requires interaction)
document.body.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

// ✅ TIME BASED MESSAGE
const hour = new Date().getHours();
let mainText = "";

if (hour >= 20 || hour < 6) {
  mainText = `${name}... I know it's late, but I couldn't sleep without saying sorry 🥺`;
} else {
  mainText = `${name}, I know I messed up... and I'm really sorry ❤️`;
}

// ✅ TYPEWRITER EFFECT
let i = 0;
function typeWriter() {
  if (i < mainText.length) {
    message.innerHTML += mainText.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}
typeWriter();

subtext.innerText = "You mean too much to me to lose over my mistake.";

// ✅ FORGIVE BUTTON
function forgive() {
  document.body.innerHTML = `
    <h1>Thank you ${name} ❤️</h1>
    <p>I promise I’ll never make you feel this way again.</p>
  `;
}

// ✅ STILL ANGRY FLOW
let step = 0;

function wait() {
  const messages = [
    "I understand... you have every right to be upset 😔",
    "I’m not here to force you… just to say I’m truly sorry ❤️",
    "Take your time, Mau. I’ll be right here… waiting.",
    "No matter how long it takes, you’re worth it for me 💖",
    "I won’t repeat this mistake… I promise.",
    "Even if you’re angry… I still care about you the same ❤️"
  ];

  subtext.style.opacity = 0;

  setTimeout(() => {
    if (step < messages.length) {
      subtext.innerText = messages[step];
      step++;
    } else {
      subtext.innerText =
        "I’ll stop bothering you now… but I’ll still be here whenever you’re ready 💔";
    }
    subtext.style.opacity = 1;
  }, 300);
}

// ✅ STAR BACKGROUND
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

setInterval(drawStars, 50);

// Resize fix
window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>

</body>
</html>
