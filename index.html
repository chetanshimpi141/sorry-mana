<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Mau ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(to right, #1e1e2f, #3a3a5a);
      color: white;
      font-family: 'Courier New', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    #container {
      max-width: 600px;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #forgiveBtn {
      background: #4CAF50;
      color: white;
    }

    #waitBtn {
      background: #ff9800;
      color: white;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>

<body>

<canvas id="stars"></canvas>

<div id="container">
  <h1 id="message"></h1>
  <p id="subtext"></p>

  <button id="forgiveBtn" onclick="forgive()">Forgive ❤️</button>
  <button id="waitBtn" onclick="wait()">Still Angry 😒</button>
</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>
  const message = document.getElementById("message");
  const subtext = document.getElementById("subtext");

  // Dynamic time-based message
  const hour = new Date().getHours();

  let mainText = "";
  if (hour >= 20 || hour < 6) {
    mainText = "Mau... I know it's late, but I couldn't sleep without saying sorry 🥺";
  } else {
    mainText = "Mau, I know I messed up... and I'm really sorry ❤️";
  }

  // Typing effect
  let i = 0;
  function typeWriter() {
    if (i < mainText.length) {
      message.innerHTML += mainText.charAt(i);
      i++;
      setTimeout(typeWriter, 50);
    }
  }
  typeWriter();

  subtext.innerText = "You mean too much to me to lose over my mistake.";

  function forgive() {
    document.body.innerHTML = "<h1>Thank you Mau ❤️ I promise I'll be better 😭</h1>";
  }

  function wait() {
    subtext.innerText = "I understand... I'll wait. But I won't give up on us ❤️";
  }

  // Star background animation
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let stars = [];

  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2
    });
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    stars.forEach(star => {
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  setInterval(drawStars, 50);
</script>

</body>
</html>
