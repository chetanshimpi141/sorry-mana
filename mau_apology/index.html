<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Mau ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(to right, #1e1e2f, #3a3a5a);
  color: white;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

#container {
  max-width: 600px;
  z-index: 1;
}

img {
  width: 250px;
  border-radius: 15px;
  margin-bottom: 20px;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

#forgiveBtn {
  background: #4CAF50;
  color: white;
  animation: pulse 1.2s infinite;
}

#waitBtn {
  background: #ff9800;
  color: white;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

#subtext {
  transition: opacity 0.4s ease;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div id="container">
  <img id="slideshow">
  <h1 id="message"></h1>
  <p id="subtext"></p>

  <button id="forgiveBtn" onclick="forgive()">Forgive ❤️</button>
  <button id="waitBtn" onclick="wait()">Still Angry 😒</button>
</div>

<audio id="bgMusic" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
</audio>

<script>

// 🔐 PASSWORD LOCK
const password = prompt("Only Mau can open this ❤️ Enter password:");

if (password !== "mau@1424") {
  document.body.innerHTML = "<h1>Access Denied 💔</h1>";
}

// 🎵 MUSIC FIX
document.body.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

// 📸 SLIDESHOW
const images = ["photo1.jpg","photo2.jpg","photo3.jpg"];
let imgIndex = 0;

function changeImage() {
  document.getElementById("slideshow").src = images[imgIndex];
  imgIndex = (imgIndex + 1) % images.length;
}
setInterval(changeImage, 2000);
changeImage();

// 💬 MESSAGE
const name = "Mau";
const message = document.getElementById("message");
const subtext = document.getElementById("subtext");

const hour = new Date().getHours();
let mainText = (hour >= 20 || hour < 6)
  ? `${name}... I couldn't sleep without saying sorry 🥺`
  : `${name}, I know I messed up... I'm really sorry ❤️`;

let i = 0;
function typeWriter() {
  if (i < mainText.length) {
    message.innerHTML += mainText.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}
typeWriter();

subtext.innerText = "You mean too much to me to lose over my mistake.";

// 😒 STILL ANGRY FLOW
let step = 0;

function wait() {
  const messages = [
    "I understand... you have every right to be upset 😔",
    "I’m not here to force you… just to say I’m truly sorry ❤️",
    "Take your time, Mau. I’ll wait.",
    "No matter how long it takes, you’re worth it 💖",
    "I won’t repeat this mistake… I promise.",
    "Even if you’re angry… I still care about you ❤️"
  ];

  subtext.style.opacity = 0;

  setTimeout(() => {
    if (step < messages.length) {
      subtext.innerText = messages[step];
      step++;
    } else {
      subtext.innerText =
        "I’ll stop bothering you now… but I’ll still be here 💔";
    }
    subtext.style.opacity = 1;
  }, 300);
}

// 💌 WHATSAPP REDIRECT
function forgive() {
  const phone = "917757910427"; // replace
  const msg = encodeURIComponent("Thank you Mau ❤️ I promise I'll fix everything.");

  window.location.href = `https://wa.me/${phone}?text=${msg}`;
}

// ⭐ STARS
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

setInterval(drawStars, 50);

</script>

</body>
</html>
